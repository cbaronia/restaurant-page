<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restuarant Page</title>
</head>
<body>
    <header>
        <nav>
            <button>Home</button>
            <button>Menu</button>
            <button>Contact</button>
        </nav>
    </header>
    <div id="content">
        <h1 class="tab-title">Cafe Name</h1>
        <img src="./ruben-ramirez-xhKG01FN2uk-unsplash.jpg" alt="Image of Cafe" class="cafe-img">
        <div class="hours">
            <h2>Hours</h2>
            <ul>
                <li>Mon-Thur: 7am - 4pm</li>
                <li>Sat: 7am - 3pm</li>
                <li>Sun: Closed</li>
            </ul>
        </div>
        <div class="location">
            <h2>Location</h2>
            <p>123 Express Drive, North Pacific City, Washington</p>
        </div>
    </div>
    <footer>
        <p>Cafe image made by Ruben Ramirez - www.unsplash.com</p>
    </footer>
</body>
</html>
